# =============================================================================
# RIMEF - Docker Compose (dev)
# =============================================================================
# Lancement : depuis App/, exécuter `make start`
# Services : Traefik + MySQL + Mailpit
# Backend Laravel et frontend Quasar : ajoutés avec leurs briques respectives
# =============================================================================

services:
  # ===========================================================================
  # TRAEFIK - Reverse Proxy
  # ===========================================================================
  rimef-traefik:
    image: traefik:v3.7.1
    container_name: rimef-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "9280:80"     # HTTP
      - "9281:8080"   # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: on-failure
    networks: [rimef-net]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.rimef.localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"

  # ===========================================================================
  # BACKEND - MySQL 8.4 LTS
  # ===========================================================================
  rimef-mysql:
    image: mysql:8.4.9
    container_name: rimef-mysql
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-rimef}"
      MYSQL_USER: "${MYSQL_USER:-rimef}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-rimef}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      TZ: UTC
    volumes:
      - rimef-mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/rimef.cnf:ro
    ports:
      - "9307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    networks: [rimef-net]

  # ===========================================================================
  # OUTILS - Mailpit (capture des emails de dev)
  # ===========================================================================
  rimef-mailpit:
    image: axllent/mailpit:v1.21
    container_name: rimef-mailpit
    environment:
      TZ: Europe/Paris
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "9826:8025"   # Web UI
      - "9526:1025"   # SMTP (accès direct optionnel)
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    networks: [rimef-net]


# =============================================================================
# NETWORKS
# =============================================================================
networks:
  rimef-net:
    driver: bridge
    name: rimef-net

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  rimef-mysql-data:
    name: rimef-mysql-data
