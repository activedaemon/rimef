# =============================================================================
# RIMEF - Docker Compose (dev)
# =============================================================================
# Lancement : depuis App/, exécuter `make start`
# Services : Traefik + Backend Laravel (PHP-FPM + Nginx) + MySQL + Mailpit
# Frontend Quasar : ajouté avec sa brique
# =============================================================================

services:
  # ===========================================================================
  # TRAEFIK - Reverse Proxy
  # ===========================================================================
  rimef-traefik:
    image: traefik:v3.7.1
    container_name: rimef-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "9280:80"     # HTTP
      - "9281:8080"   # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: on-failure
    networks: [rimef-net]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.rimef.localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"

  # ===========================================================================
  # BACKEND - MySQL 8.4 LTS
  # ===========================================================================
  rimef-mysql:
    image: mysql:8.4.9
    container_name: rimef-mysql
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-rimef_central}"
      MYSQL_USER: "${MYSQL_USER:-rimef}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-rimef}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      TZ: UTC
    volumes:
      - rimef-mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/rimef.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "9307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    networks: [rimef-net]

  # ===========================================================================
  # BACKEND - PHP-FPM 8.5 (Laravel)
  # ===========================================================================
  rimef-php:
    build:
      context: ..
      dockerfile: .docker/backend/php/Dockerfile
    container_name: rimef-php
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
    environment:
      TZ: UTC
      COMPOSER_HOME: /tmp/composer
    depends_on:
      rimef-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure
    networks: [rimef-net]

  # ===========================================================================
  # BACKEND - Nginx (vhost Laravel)
  # ===========================================================================
  rimef-nginx:
    build:
      context: ..
      dockerfile: .docker/backend/nginx/Dockerfile
    container_name: rimef-nginx
    volumes:
      - ../backend:/var/www/html:ro
    depends_on:
      rimef-php:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/nginx-health -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: on-failure
    networks: [rimef-net]
    labels:
      - "traefik.enable=true"

      # ---------------------------------------------------------------------
      # Route Backend API (même domaine que le frontend, préfixe /api)
      #   - rimef.localhost/api/*             → tenant rimef
      #   - supervisor.rimef.localhost/api/*  → central (supervision)
      # Priorité 200 : passe devant le frontend (ajouté à la brique 4)
      # ---------------------------------------------------------------------
      - "traefik.http.routers.backend.rule=(Host(`rimef.localhost`) || Host(`supervisor.rimef.localhost`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=200"
      - "traefik.http.routers.backend.service=backend-service"

      # Service Backend (Nginx → PHP-FPM)
      - "traefik.http.services.backend-service.loadbalancer.server.port=80"
      - "traefik.http.services.backend-service.loadbalancer.passHostHeader=true"

  # ===========================================================================
  # OUTILS - Mailpit (capture des emails de dev)
  # ===========================================================================
  rimef-mailpit:
    image: axllent/mailpit:v1.21
    container_name: rimef-mailpit
    environment:
      TZ: Europe/Paris
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "9826:8025"   # Web UI
      - "9526:1025"   # SMTP (accès direct optionnel)
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    networks: [rimef-net]


# =============================================================================
# NETWORKS
# =============================================================================
networks:
  rimef-net:
    driver: bridge
    name: rimef-net

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  rimef-mysql-data:
    name: rimef-mysql-data
