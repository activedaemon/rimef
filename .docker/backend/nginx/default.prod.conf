# =============================================================================
# Vhost Nginx RIMeF — PREPROD (un seul hôte : SPA des membres + API)
# =============================================================================
# - /api/*  → Laravel (backend/public/index.php)
# - le reste → SPA Quasar statique (frontend/app/dist), fallback history mode
# Le code est résolu via le symlink `current` (bascule atomique au déploiement).
# TLS terminé en amont par le Traefik du serveur.
# Monté à la place de default.conf (dev) par .docker/docker-compose.preprod.yml.
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    root /var/www/current/backend/public;
    index index.html;

    client_max_body_size 64M;

    # --- Recette privée : mot de passe devant tout le site, aucun référencement --
    # Fichier généré par `make -f Makefile.prod preprod-bootstrap`.
    auth_basic "RIMeF recette";
    auth_basic_user_file /var/www/shared/basic-auth.htpasswd;

    # Les add_header ne sont pas hérités par une location qui en définit : les
    # locations ci-dessous n'en posent donc aucun (expires suffit au cache).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Healthcheck nginx (indépendant de PHP/Laravel), hors mot de passe
    location = /nginx-health {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API Laravel ------------------------------------------------------------
    location ^~ /api {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Nom complet : sur le réseau de Traefik, d'autres projets ont un service « php »
        fastcgi_pass rimef-preprod-php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- SPA des membres -------------------------------------------------------
    # Fichiers versionnés par Vite (nom avec empreinte) : cache long
    location ^~ /assets/ {
        root /var/www/current/frontend/app/dist;
        expires 1y;
        access_log off;
    }

    # index.html jamais mis en cache : un déploiement est visible immédiatement
    location = /index.html {
        root /var/www/current/frontend/app/dist;
        expires -1;
    }

    location / {
        root /var/www/current/frontend/app/dist;
        try_files $uri $uri/ /index.html;
    }
}
