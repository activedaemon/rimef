; Conf PHP dev pour RIMeF backend
; Surcharge de la config par défaut php-fpm Debian.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

memory_limit = 512M
max_execution_time = 120
post_max_size = 64M
upload_max_filesize = 64M

; UTC : la conversion dans le fuseau de l'utilisatrice se fait côté application
date.timezone = UTC

; OPcache : revalidation rapide en dev pour voir les modifs de code immédiatement
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
