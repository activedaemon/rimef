; Conf PHP de preprod/prod pour RIMeF backend
; Monté à la place de php.ini (dev) par .docker/docker-compose.preprod.yml.

display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = On
expose_php = Off

memory_limit = 512M
max_execution_time = 120
post_max_size = 64M
upload_max_filesize = 64M

; UTC : la conversion dans le fuseau de l'utilisatrice se fait côté application
date.timezone = UTC

; OPcache : timestamps figés, deploy.sh redémarre php-fpm à chaque release
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
