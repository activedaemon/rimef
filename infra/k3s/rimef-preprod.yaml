# =============================================================================
# RIMeF - Relais K3s vers la preprod Docker (serveur Active Daemon)
# =============================================================================
# Hébergement temporaire : les ports 80/443 du serveur appartiennent à l'ingress
# NGINX du K3s de Seckup. RIMeF tourne en Docker à côté (docker-compose.preprod.yml)
# et l'ingress lui relaie ses deux hôtes, TLS compris (cert-manager, ClusterIssuer
# `letsencrypt` existant, challenge HTTP-01).
#
#   rimef.active-daemon.com       → 172.17.0.1:9380 (nginx : SPA + API)
#   mail.rimef.active-daemon.com  → 172.17.0.1:9381 (Mailpit)
#
# 172.17.0.1 = interface docker0 de l'hôte, joignable depuis les pods.
# Appliqué par `make -f Makefile.prod preprod-bootstrap` (kubectl apply -f).
# Retrait : kubectl delete -f infra/k3s/rimef-preprod.yaml
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: rimef-preprod
---
# --- Application (SPA + API) -------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: rimef-app
  namespace: rimef-preprod
spec:
  ports:
    - name: http
      port: 80
      targetPort: 9380
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: rimef-app
  namespace: rimef-preprod
  labels:
    kubernetes.io/service-name: rimef-app
addressType: IPv4
ports:
  - name: http
    port: 9380
    protocol: TCP
endpoints:
  - addresses: ["172.17.0.1"]
---
# --- Mailpit -----------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: rimef-mailpit
  namespace: rimef-preprod
spec:
  ports:
    - name: http
      port: 80
      targetPort: 9381
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: rimef-mailpit
  namespace: rimef-preprod
  labels:
    kubernetes.io/service-name: rimef-mailpit
addressType: IPv4
ports:
  - name: http
    port: 9381
    protocol: TCP
endpoints:
  - addresses: ["172.17.0.1"]
---
# --- Ingress (TLS Let's Encrypt par hôte) --------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rimef-preprod
  namespace: rimef-preprod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rimef.active-daemon.com
      secretName: rimef-preprod-tls
    - hosts:
        - mail.rimef.active-daemon.com
      secretName: rimef-preprod-mail-tls
  rules:
    - host: rimef.active-daemon.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rimef-app
                port:
                  number: 80
    - host: mail.rimef.active-daemon.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rimef-mailpit
                port:
                  number: 80
